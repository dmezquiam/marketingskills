name: Sync skills to Anthropic API

# Sube a la API de Anthropic las skills listadas en anthropic-skills.json.
# - Primera vez (id vacio): crea la skill y guarda el skill_id en el json.
# - Siguientes veces: crea una version nueva del mismo skill_id, asi el
#   panel /admin/agent de BeDigitaly no hay que tocarlo.
# Se ejecuta al hacer push en main con cambios en skills/ (por ejemplo tras
# "Sync fork" desde el repo original) o a mano desde la pestana Actions.

on:
  push:
    branches: [main]
    paths:
      - "skills/**"
      - "anthropic-skills.json"
  workflow_dispatch:
    inputs:
      force_all:
        description: "Subir todas las skills del json aunque no hayan cambiado"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: sync-anthropic-skills
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Upload skills
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FORCE_ALL: ${{ inputs.force_all }}
        run: bash .github/scripts/sync-anthropic-skills.sh

      - name: Commit new skill ids
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add anthropic-skills.json
          if git diff --cached --quiet; then
            echo "No new skill ids to commit."
          else
            git commit -m "chore: record Anthropic skill ids [skip ci]"
            git push
          fi
