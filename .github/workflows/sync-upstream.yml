name: Sync fork with upstream

# Cada viernes a las 12:00 (hora de Madrid) trae los cambios del repo original
# (coreyhaines31/marketingskills) a este fork, lanza la subida de skills a la
# API de Anthropic y envia SIEMPRE un correo: con el resumen de lo que cambio,
# o confirmando que no hubo cambios.
# El cron corre a las 10 y a las 11 UTC y solo actua cuando en Madrid son las 12,
# asi funciona igual en horario de verano e invierno.

on:
  schedule:
    - cron: "0 10,11 * * 5"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

env:
  UPSTREAM: https://github.com/coreyhaines31/marketingskills.git
  NOTIFY_TO: support@bedigitaly.com
  NOTIFY_FROM: BeDigitaly <support@bedigitaly.com>

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Is it 12:00 in Madrid? (skip otherwise)
        id: gate
        run: |
          hour=$(TZ=Europe/Madrid date +%H)
          if [[ "${{ github.event_name }}" == "workflow_dispatch" || "$hour" == "12" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "Madrid hour is $hour, skipping."
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'
        with:
          fetch-depth: 0

      - name: Merge upstream/main
        if: steps.gate.outputs.run == 'true'
        id: merge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream "$UPSTREAM"
          git fetch upstream main
          before=$(git rev-parse HEAD)
          echo "upstream_sha=$(git rev-parse --short upstream/main)" >> "$GITHUB_OUTPUT"
          echo "upstream_date=$(git log -1 --format=%cd --date=short upstream/main)" >> "$GITHUB_OUTPUT"
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "changed=false" >> "$GITHUB_OUTPUT"; echo "Already up to date."; exit 0
          fi
          if ! git merge --no-edit upstream/main; then
            echo "changed=conflict" >> "$GITHUB_OUTPUT"
            git diff --name-only --diff-filter=U > /tmp/conflicts.txt
            git merge --abort
            exit 0
          fi
          git push origin main
          echo "changed=true" >> "$GITHUB_OUTPUT"
          git diff --name-status "$before" HEAD > /tmp/changed-files.txt
          git log --oneline "$before..upstream/main" > /tmp/upstream-commits.txt
          # Skills touched by the merge, for the email.
          git diff --name-only "$before" HEAD -- skills | awk -F/ '{print $2}' | sort -u > /tmp/changed-skills.txt

      - name: Trigger skills upload to Anthropic
        if: steps.merge.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run sync-anthropic-skills.yml --ref main

      - name: Email summary (Resend)
        if: steps.gate.outputs.run == 'true'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          CHANGED: ${{ steps.merge.outputs.changed }}
          UPSTREAM_SHA: ${{ steps.merge.outputs.upstream_sha }}
          UPSTREAM_DATE: ${{ steps.merge.outputs.upstream_date }}
        run: |
          if [[ -z "$RESEND_API_KEY" ]]; then echo "::error::RESEND_API_KEY secret not set, cannot send email."; exit 1; fi
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          today=$(TZ=Europe/Madrid date +%Y-%m-%d)
          if [[ "$CHANGED" == "conflict" ]]; then
            subject="Skills repo: merge conflict, manual action needed"
            body="<p>The weekly sync of <b>${{ github.repository }}</b> with the original repo hit a merge conflict and was aborted. Nothing changed.</p><p>Conflicting files:</p><pre>$(cat /tmp/conflicts.txt)</pre><p><a href=\"$run_url\">Open the run</a></p>"
          elif [[ "$CHANGED" == "true" ]]; then
            skills=$(sed 's/^/- /' /tmp/changed-skills.txt)
            subject="Skills repo updated ($today): $(wc -l < /tmp/changed-skills.txt | tr -d ' ') skills changed"
            body="<p>The repo <b>${{ github.repository }}</b> was synced with the original repo. The changed skills are being uploaded to the Anthropic API now; the BeDigitaly agent will use the new versions on its next run.</p><p><b>Skills changed:</b></p><pre>${skills:-none}</pre><p><b>Upstream commits:</b></p><pre>$(cat /tmp/upstream-commits.txt)</pre><p><a href=\"$run_url\">Open the run</a> | <a href=\"${{ github.server_url }}/${{ github.repository }}/actions\">Actions</a></p>"
          else
            subject="Skills repo checked ($today): no changes"
            body="<p>Weekly check of <b>${{ github.repository }}</b>: the original repo has no new changes since the last sync. Nothing was uploaded to the Anthropic API; the agent keeps using the current skill versions.</p><p>Latest upstream commit: <code>$UPSTREAM_SHA</code> ($UPSTREAM_DATE).</p><p><a href=\"$run_url\">Open the run</a></p>"
          fi
          jq -n --arg from "$NOTIFY_FROM" --arg to "$NOTIFY_TO" --arg subject "$subject" --arg html "$body" \
            '{from:$from, to:[$to], reply_to:$to, subject:$subject, html:$html}' \
          | curl -sS --fail-with-body -X POST https://api.resend.com/emails \
              -H "Authorization: Bearer $RESEND_API_KEY" -H "Content-Type: application/json" -d @- \
          | jq -r '.id // .message // .'
